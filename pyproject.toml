[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osdagbridge"
version = "1.0.0"
description = "OsdagBridge - Shared core for analysis and design of steel bridges (CLI, Desktop, Web)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Osdag", email = "contact-osdag@efossee.in" }
]
requires-python = ">=3.10,<3.13"

keywords = ["bridge", "steel", "structural engineering", "analysis", "IRC", "IS 800", "Osdag"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
]

# ------------------------------
# Core runtime dependencies
# ------------------------------
dependencies = [
  "openseespy>=3.2.2.6",
  "opsvis>=1.0",
  "xarray",
  "matplotlib"
  "numpy",
  "scipy",
]

[project.optional-dependencies]
test = ["pytest >= 6.2.2"]
gui = ["PySide6<=6.9",]
occ = ["pythonocc-core"]
latex = ["pylatex>=1.4"]
legacy-viz = ["vfo>=0.0.6"]

# ------------------------------
# setuptools config
# ------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

#  ------------------------------
# Console scripts for CLI and Desktop entry points
#  ------------------------------
[project.scripts]
osdagbridge-cli = "osdagbridge.cli.__main__:main"
osdagbridge = "osdagbridge.desktop.__main__:main"

[tool.setuptools.package-data]
osdagbridge = [
    "core/data/**/*",
    "core/reports/templates/**/*",
    "desktop/resources/**/*",

]

# ------------------------------
# Tools: Ruff, Black, Mypy, Pytest
# ------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
  "tests"
]


